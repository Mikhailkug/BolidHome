
name: Build BolidHome APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -q BolidHome_v0.2_phone_build.zip -d source

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug
      - name: Check APK
        working-directory: source
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "=== APK INFO ==="
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | head -n 10
          echo "=== APK SIGNATURE ==="
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BolidHome-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
